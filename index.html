<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珊的美甲紀錄</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="grain"></div>

<header class="hero">
  <div class="hero-inner">
    <p class="eyebrow">Nail Journal</p>
    <h1>珊的美甲紀錄</h1>
    <p class="sub">每一次上色，都是一段紀錄</p>
  </div>
  <div class="hero-line"></div>
</header>

<main class="wrap">

  <!-- 新增紀錄 -->
  <section class="card entry-card" id="entryCard">
    <div class="card-head">
      <span class="card-tag">新增紀錄</span>
      <h2>今天做了什麼款式？</h2>
    </div>

    <form id="entryForm">
      <div class="field-row">
        <label class="field">
          <span class="field-label">日期</span>
          <input type="date" id="fDate" required>
        </label>
      </div>

      <div class="field-row three">
        <label class="field">
          <span class="field-label">款式金額 <em>NTD</em></span>
          <input type="text" inputmode="numeric" class="money-input" id="fStyle" placeholder="0">
        </label>
        <label class="field">
          <span class="field-label">卸甲金額 <em>NTD</em></span>
          <input type="text" inputmode="numeric" class="money-input" id="fRemove" placeholder="0">
        </label>
        <label class="field">
          <span class="field-label">優惠/特殊費用 <em>NTD</em></span>
          <input type="text" inputmode="numeric" class="money-input" id="fDiscount" placeholder="0，折扣可輸入負數">
        </label>
      </div>

      <div class="total-line">
        <span>總額</span>
        <span class="total-value">NT$ <b id="fTotal">0</b></span>
      </div>

      <div class="field-row two upload-row">
        <div class="upload-field">
          <span class="field-label">參考款式（上傳圖片）</span>
          <label class="dropzone" id="refDrop">
            <input type="file" accept="image/*" id="fRefImg" hidden>
            <div class="dropzone-inner" id="refPreviewWrap">
              <span class="dz-icon">＋</span>
              <span class="dz-text">點擊上傳參考圖</span>
            </div>
          </label>
        </div>
        <div class="upload-field">
          <span class="field-label">施作款式（上傳圖片）</span>
          <label class="dropzone" id="actDrop">
            <input type="file" accept="image/*" id="fActImg" hidden>
            <div class="dropzone-inner" id="actPreviewWrap">
              <span class="dz-icon">＋</span>
              <span class="dz-text">點擊上傳完成圖</span>
            </div>
          </label>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">
        <span>儲存紀錄</span>
      </button>
      <p class="form-msg" id="formMsg"></p>
    </form>
  </section>

  <!-- 歷史紀錄 -->
  <section class="history-section">
    <div class="card-head history-head">
      <span class="card-tag gold">歷史紀錄</span>
      <h2>時間軸</h2>
      <button class="refresh-btn" id="refreshBtn" title="重新整理">⟳</button>
    </div>

    <div id="timeline" class="timeline">
      <p class="empty-state" id="emptyState">尚未連接資料，或還沒有任何紀錄。</p>
    </div>
  </section>

</main>

<footer class="foot">
  <p>資料儲存於 Google 試算表 · 圖片儲存於 Google 雲端硬碟</p>
</footer>

<!-- 燈箱 -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
