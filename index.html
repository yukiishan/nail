<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>珊的美甲紀錄</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<meta name="theme-color" content="#8FA377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="珊的美甲紀錄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">✦</span>
    <div class="brand-text">
      <h1>珊的美甲紀錄</h1>
      <p>Nail Care Log</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="add">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
      新增紀錄
    </button>
    <button class="tab-btn" data-tab="list">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      紀錄明細
    </button>
    <button class="tab-btn" data-tab="timeline">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      時間軸
    </button>
  </nav>
</header>

<!-- 手機版底部導覽列 -->
<nav class="bottom-nav" id="bottomNav">
  <button class="bn-btn active" data-tab="add">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
    <span class="bn-label">新增</span>
  </button>
  <button class="bn-btn" data-tab="list">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
    <span class="bn-label">明細</span>
  </button>
  <button class="bn-btn" data-tab="timeline">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span class="bn-label">時間軸</span>
  </button>
</nav>

<main class="wrap">

  <!-- ============ 分頁一：新增 / 編輯紀錄 ============ -->
  <section class="panel active" id="panel-add">
    <div class="card entry-card">
      <div class="card-head form-head">
        <div class="tag-row">
          <span class="card-tag" id="formModeTag">新增紀錄</span>
          <button type="button" class="back-btn" id="backBtn" hidden>← 返回明細</button>
        </div>
        <h2 id="formModeTitle">今天做了什麼款式？</h2>
      </div>

      <form id="entryForm">
        <div class="field-row two">
          <label class="field">
            <span class="field-label">日期</span>
            <input type="date" id="fDate" required>
          </label>
          <label class="field">
            <span class="field-label">施作部位</span>
            <select id="fPart" required>
              <option value="">請選擇</option>
              <option value="手">手</option>
              <option value="足">足</option>
            </select>
          </label>
        </div>

        <div class="field-row three">
          <label class="field">
            <span class="field-label">款式金額 <em>NTD</em></span>
            <input type="text" inputmode="numeric" class="money-input" id="fStyle" placeholder="0">
          </label>
          <label class="field">
            <span class="field-label">卸甲金額 <em>NTD</em></span>
            <input type="text" inputmode="numeric" class="money-input" id="fRemove" placeholder="0">
          </label>
          <label class="field">
            <span class="field-label">優惠/特殊費用 <em>NTD</em></span>
            <input type="text" inputmode="numeric" class="money-input" id="fDiscount" placeholder="0，折扣可輸入負數">
          </label>
        </div>

        <div class="total-line">
          <span>總額</span>
          <span class="total-value">NT$ <b id="fTotal">0</b></span>
        </div>

        <div class="field-row two upload-row">
          <div class="upload-field">
            <span class="field-label">參考款式（上傳圖片，單張）</span>
            <label class="dropzone" id="refDrop">
              <input type="file" accept="image/*" id="fRefImg" hidden>
              <div class="dropzone-inner" id="refPreviewWrap">
                <span class="dz-icon">＋</span>
                <span class="dz-text">點擊上傳參考圖</span>
              </div>
            </label>
          </div>

          <div class="upload-field">
            <span class="field-label">施作款式（可上傳多張圖片）</span>
            <label class="dropzone multi" id="actDrop">
              <input type="file" accept="image/*" id="fActImg" multiple hidden>
              <div class="dropzone-inner" id="actAddPreview">
                <span class="dz-icon">＋</span>
                <span class="dz-text">點擊新增完成圖（可多選）</span>
              </div>
            </label>
            <div class="thumb-grid" id="actThumbGrid"></div>
          </div>
        </div>

        <div class="field-row upload-row">
          <div class="upload-field">
            <span class="field-label">施作影片（選填，單支）</span>
            <label class="dropzone video" id="videoDrop">
              <input type="file" accept="video/*" id="fVideo" hidden>
              <div class="dropzone-inner" id="videoPreviewWrap">
                <span class="dz-icon">▶</span>
                <span class="dz-text">點擊上傳影片</span>
              </div>
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" id="submitBtn">
            <span id="submitBtnText">儲存紀錄</span>
          </button>
          <button type="button" class="cancel-btn" id="cancelEditBtn" hidden>取消編輯</button>
        </div>
        <p class="form-msg" id="formMsg"></p>
      </form>
    </div>
  </section>

  <!-- ============ 分頁二：紀錄明細（表格） ============ -->
  <section class="panel" id="panel-list">
    <div class="card-head list-head">
      <span class="card-tag gold">紀錄明細</span>
      <h2>所有紀錄</h2>
      <div class="head-actions">
        <button class="icon-btn" id="backupBtnList" title="手動備份">💾</button>
        <button class="refresh-btn" id="refreshBtnList" title="重新整理">⟳</button>
      </div>
    </div>

    <div class="table-wrap desktop-only">
      <table class="record-table" id="recordTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>部位</th>
            <th>款式金額</th>
            <th>卸甲金額</th>
            <th>優惠/特殊</th>
            <th>總額</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="recordTableBody"></tbody>
      </table>
    </div>

    <div class="mobile-list mobile-only" id="mobileList"></div>

    <p class="empty-state" id="emptyStateList">尚未連接資料，或還沒有任何紀錄。</p>
  </section>

  <!-- ============ 分頁三：時間軸 ============ -->
  <section class="panel" id="panel-timeline">
    <div class="card-head list-head">
      <span class="card-tag gold">時間軸</span>
      <h2>紀錄回顧</h2>
      <div class="head-actions">
        <button class="icon-btn" id="backupBtnTimeline" title="手動備份">💾</button>
        <button class="refresh-btn" id="refreshBtnTimeline" title="重新整理">⟳</button>
      </div>
    </div>

    <div id="timeline" class="timeline">
      <p class="empty-state" id="emptyStateTimeline">尚未連接資料，或還沒有任何紀錄。</p>
    </div>
  </section>

</main>

<footer class="foot">
  <p>資料儲存於 Google 試算表 · 圖片與影片儲存於 Google 雲端硬碟</p>
</footer>

<!-- 燈箱 -->
<div class="lightbox" id="lightbox">
  <img id="lightboxImg" src="" alt="">
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
