<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>珊的美甲紀錄</title>
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<meta name="theme-color" content="#8FA377">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="珊的美甲紀錄">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=15">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 100 100" fill="none" stroke="#F7F9F3" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round">
        <defs>
          <path id="bmpetal" d="M0,0 C-8,-7 -10,-19 -5,-26 C-3,-29 -1,-28 0,-25 C1,-28 3,-29 5,-26 C10,-19 8,-7 0,0 Z"/>
        </defs>
        <g transform="translate(50,50)">
          <use href="#bmpetal"/>
          <use href="#bmpetal" transform="rotate(72)"/>
          <use href="#bmpetal" transform="rotate(144)"/>
          <use href="#bmpetal" transform="rotate(216)"/>
          <use href="#bmpetal" transform="rotate(288)"/>
          <circle cx="0" cy="0" r="3"/>
        </g>
      </svg>
    </span>
    <div class="brand-text">
      <h1>珊的美甲紀錄</h1>
      <p>Nail Care Log</p>
    </div>
  </div>
  <nav class="tabs" id="tabs">
    <button class="tab-btn active" data-tab="add">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
      新增紀錄
    </button>
    <button class="tab-btn" data-tab="list">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
      紀錄明細
    </button>
    <button class="tab-btn" data-tab="timeline">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      時間軸
    </button>
  </nav>
</header>

<!-- 手機版底部導覽列 -->
<nav class="bottom-nav" id="bottomNav">
  <button class="bn-btn active" data-tab="add">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>
    <span class="bn-label">新增</span>
  </button>
  <button class="bn-btn" data-tab="list">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="3.5" cy="6" r="1"/><circle cx="3.5" cy="12" r="1"/><circle cx="3.5" cy="18" r="1"/></svg>
    <span class="bn-label">明細</span>
  </button>
  <button class="bn-btn" data-tab="timeline">
    <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
    <span class="bn-label">時間軸</span>
  </button>
</nav>

<main class="wrap">

  <!-- ============ 分頁一：新增 / 編輯紀錄 ============ -->
  <section class="panel active" id="panel-add">
    <div class="card entry-card">
      <div class="card-head form-head">
        <div class="tag-row">
          <span class="card-tag" id="formModeTag">新增紀錄</span>
          <button type="button" class="back-btn" id="backBtn" hidden>← 返回明細</button>
        </div>
        <h2 id="formModeTitle">今天做了什麼款式？</h2>
      </div>

      <form id="entryForm">
        <div class="field-row two">
          <label class="field">
            <span class="field-label">日期</span>
            <div class="date-display-box" id="dateDisplayBox">
              <span id="fDateDisplay">請選擇日期</span>
              <svg class="date-cal-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
              <input type="date" id="fDate" class="date-native-input" required>
            </div>
          </label>
          <label class="field">
            <span class="field-label">施作部位</span>
            <select id="fPart" required>
              <option value="">請選擇</option>
              <option value="手">手</option>
              <option value="足">足</option>
            </select>
          </label>
        </div>

        <div class="field-row three">
          <label class="field">
            <span class="field-label">款式金額 <em>NTD</em></span>
            <input type="text" inputmode="numeric" class="money-input" id="fStyle" placeholder="0">
          </label>
          <label class="field">
            <span class="field-label">卸甲金額 <em>NTD</em></span>
            <input type="text" inputmode="numeric" class="money-input" id="fRemove" placeholder="0">
          </label>
          <label class="field">
            <span class="field-label">優惠/特殊費用 <em>NTD</em></span>
            <div class="discount-input-wrap">
              <input type="text" inputmode="numeric" class="money-input discount-input" id="fDiscount" placeholder="0">
              <button type="button" class="discount-sign-btn" id="discountSignBtn" title="轉為負數（優惠折抵）">優惠</button>
            </div>
          </label>
        </div>

        <div class="total-line">
          <span>總額</span>
          <span class="total-value">NT$ <b id="fTotal">0</b></span>
        </div>

        <div class="field-row two upload-row">
          <div class="upload-field">
            <span class="field-label">參考款式（可上傳多張圖片）</span>
            <label class="dropzone multi" id="refDrop">
              <input type="file" accept="image/*" id="fRefImg" multiple hidden>
              <div class="dropzone-inner" id="refAddPreview">
                <span class="dz-icon">＋</span>
                <span class="dz-text">點擊新增參考圖（可多選）</span>
              </div>
            </label>
            <div class="thumb-grid" id="refThumbGrid"></div>
          </div>

          <div class="upload-field">
            <span class="field-label">施作款式（可上傳多張圖片）</span>
            <label class="dropzone multi" id="actDrop">
              <input type="file" accept="image/*" id="fActImg" multiple hidden>
              <div class="dropzone-inner" id="actAddPreview">
                <span class="dz-icon">＋</span>
                <span class="dz-text">點擊新增完成圖（可多選）</span>
              </div>
            </label>
            <div class="thumb-grid" id="actThumbGrid"></div>
          </div>
        </div>


        <div class="field-row upload-row">
          <div class="upload-field">
            <span class="field-label">施作影片（可上傳多支，選填）</span>
            <label class="dropzone video" id="videoDrop">
              <input type="file" accept="video/*" id="fVideo" multiple hidden>
              <div class="dropzone-inner" id="videoAddPreview">
                <span class="dz-icon">▶</span>
                <span class="dz-text">點擊新增影片（可多選）</span>
              </div>
            </label>
            <div class="video-list" id="videoListGrid"></div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="submit-btn" id="submitBtn">
            <span id="submitBtnText">儲存紀錄</span>
          </button>
          <button type="button" class="cancel-btn" id="cancelEditBtn" hidden>取消編輯</button>
        </div>
        <p class="form-msg" id="formMsg"></p>
      </form>
    </div>
  </section>

  <!-- ============ 分頁二：紀錄明細（表格） ============ -->
  <section class="panel" id="panel-list">
    <div class="card-head list-head">
      <span class="card-tag gold">紀錄明細</span>
      <h2>所有紀錄</h2>
      <div class="head-actions">
        <button class="icon-btn" id="restoreBtnList" title="還原備份">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 5v5h5"/><path d="M12 8v4l3 2"/></svg>
        </button>
        <button class="icon-btn" id="backupBtnList" title="手動備份">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17.5a4.5 4.5 0 0 1-.4-8.98A5.5 5.5 0 0 1 17.4 7.52 4 4 0 0 1 17 15.5"/><path d="M12 11v8"/><path d="M9 14l3-3 3 3"/></svg>
        </button>
        <button class="refresh-btn" id="refreshBtnList" title="重新整理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div class="filter-row" id="filterRowList">
      <button type="button" class="filter-btn active" data-part="">全部</button>
      <button type="button" class="filter-btn" data-part="手">手</button>
      <button type="button" class="filter-btn" data-part="足">足</button>
    </div>

    <div class="restore-panel" id="restorePanelList" hidden>
      <p class="restore-hint">選擇一份備份，將會覆蓋目前所有紀錄，請謹慎操作。</p>
      <div class="restore-row">
        <select id="restoreSelectList"><option value="">讀取備份清單中…</option></select>
        <button type="button" class="restore-confirm-btn" id="restoreConfirmList">還原此備份</button>
        <button type="button" class="restore-cancel-btn" id="restoreCancelList">取消還原</button>
      </div>
    </div>

    <div class="table-wrap desktop-only">
      <table class="record-table" id="recordTable">
        <thead>
          <tr>
            <th>日期</th>
            <th>部位</th>
            <th>款式金額</th>
            <th>卸甲金額</th>
            <th>優惠/特殊</th>
            <th>總額</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="recordTableBody"></tbody>
      </table>
    </div>

    <div class="mobile-list mobile-only" id="mobileList"></div>

    <p class="empty-state" id="emptyStateList">尚未連接資料，或還沒有任何紀錄。</p>
  </section>

  <!-- ============ 分頁三：時間軸 ============ -->
  <section class="panel" id="panel-timeline">
    <div class="card-head list-head">
      <span class="card-tag gold">時間軸</span>
      <h2>紀錄回顧</h2>
      <div class="head-actions">
        <button class="icon-btn" id="restoreBtnTimeline" title="還原備份">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 5v5h5"/><path d="M12 8v4l3 2"/></svg>
        </button>
        <button class="icon-btn" id="backupBtnTimeline" title="手動備份">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17.5a4.5 4.5 0 0 1-.4-8.98A5.5 5.5 0 0 1 17.4 7.52 4 4 0 0 1 17 15.5"/><path d="M12 11v8"/><path d="M9 14l3-3 3 3"/></svg>
        </button>
        <button class="refresh-btn" id="refreshBtnTimeline" title="重新整理">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
      </div>
    </div>

    <div class="filter-row" id="filterRowTimeline">
      <button type="button" class="filter-btn active" data-part="">全部</button>
      <button type="button" class="filter-btn" data-part="手">手</button>
      <button type="button" class="filter-btn" data-part="足">足</button>
    </div>

    <div class="restore-panel" id="restorePanelTimeline" hidden>
      <p class="restore-hint">選擇一份備份，將會覆蓋目前所有紀錄，請謹慎操作。</p>
      <div class="restore-row">
        <select id="restoreSelectTimeline"><option value="">讀取備份清單中…</option></select>
        <button type="button" class="restore-confirm-btn" id="restoreConfirmTimeline">還原此備份</button>
        <button type="button" class="restore-cancel-btn" id="restoreCancelTimeline">取消還原</button>
      </div>
    </div>

    <div id="timeline" class="timeline">
      <p class="empty-state" id="emptyStateTimeline">尚未連接資料，或還沒有任何紀錄。</p>
    </div>
  </section>

</main>

<footer class="foot">
  <p>資料儲存於 Google 試算表 · 圖片與影片儲存於 Google 雲端硬碟</p>
</footer>

<!-- 燈箱 -->
<div class="lightbox" id="lightbox">
  <button type="button" class="lb-nav lb-prev" id="lbPrev">‹</button>
  <img id="lightboxImg" src="" alt="">
  <button type="button" class="lb-nav lb-next" id="lbNext">›</button>
  <div class="lb-dots" id="lbDots"></div>
</div>

<script src="config.js?v=15"></script>
<script src="app.js?v=15"></script>
</body>
</html>
